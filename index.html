<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penso – enkelt regnskap for flere selskaper</title>
<meta name="description" content="Enkelt regnskap for holding og datterselskaper. Under utvikling.">
<meta property="og:title" content="Penso – enkelt regnskap for flere selskaper">
<meta property="og:description" content="Enkelt regnskap for holding og datterselskaper. Under utvikling.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://penso.no/">
<meta property="og:image" content="https://penso.no/penso-ikon-512.png">
<meta name="theme-color" content="#ffffff">
<link rel="canonical" href="https://penso.no/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root { --ink: #16181b; --ink-2: #555b63; --line: #ebebeb; --hero: #e6f0eb; --accent: #0e5a4a; --accent-hover: #0a4a3d; --focus: #2f6fd6;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #fff; color: var(--ink); font: 17px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
body { min-height: 100dvh; display: flex; flex-direction: column; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 24px; }

header .wrap { display: flex; align-items: center; justify-content: space-between; height: 72px; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 700; letter-spacing: -.02em; color: var(--ink); text-decoration: none; }
.brand img { width: 30px; height: 30px; }

main { flex: 1; display: flex; padding: 0 16px 16px; }
.band { flex: 1; display: flex; align-items: center; background: var(--hero); border-radius: 24px; }
.hero { text-align: center; padding-block: 72px 112px; }
h1 { font-size: clamp(38px, 6vw, 64px); line-height: 1.08; letter-spacing: -.02em; font-weight: 750; margin: 0 auto 36px; max-width: 12em; text-wrap: balance; }
.btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; font-size: 17px;
  border-radius: 999px; padding: 15px 32px; transition: background-color .18s; }
.btn:hover { background: var(--accent-hover); }
.btn:active { transform: translateY(1px); }
.status { margin: 18px 0 0; font-size: 15px; color: var(--ink-2); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 560px) { .wrap { padding-inline: 16px; } main { padding: 0 8px 8px; } .band { border-radius: 18px; } .hero { padding-block: 48px 80px; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="/" aria-label="Penso, til forsiden"><img src="/favicon.svg" alt="" width="30" height="30">Penso</a>
  </div>
</header>

<main>
  <div class="band"><div class="wrap hero">
    <h1>Enkelt regnskap for flere selskaper</h1>
    <a class="btn" href="mailto:hei@penso.no">Ta kontakt</a>
    <p class="status">Under utvikling</p>
  </div></div>
</main>

</body>
</html>
